    <!--
      Set the theme before first paint. Without this the page renders light and
      then snaps to dark, which is the single most visible polish failure on a
      dark-first site.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
